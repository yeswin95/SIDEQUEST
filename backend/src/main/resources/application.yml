spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: sidequest-backend
  datasource:
    # prod profile (application-prod.yml) overrides this via DatabaseUrlProcessor which converts DATABASE_URL -> jdbc
    url: jdbc:postgresql://localhost:5432/sidequest
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

server:
  port: ${PORT:8080}

sidequest:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-please-never-use-in-production!}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  admin:
    purge-secret: ${PURGE_SECRET:}

logging:
  level:
    org.springframework.security: INFO
