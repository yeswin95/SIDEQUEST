spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/sidequest}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
      auto-commit: false
      # Supabase pgbouncer (transaction mode, 6543) does not support server-prepared statements
      # Disable server-prepared statement cache to fix "prepared statement S_1/S_2 already exists"
      data-source-properties:
        prepareThreshold: 0
        preparedStatementCacheQueries: 0
        preparedStatementCacheSizeMiB: 0
        preferQueryMode: simple
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.lob.non_contextual_creation: true
        connection.provider_disables_autocommit: true
  sql:
    init:
      mode: always
      # schema.sql and data.sql auto-run if present

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

sidequest:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost:3000}
  admin:
    purge-secret: ${PURGE_SECRET:}
  keep-alive:
    enabled: ${KEEP_ALIVE_ENABLED:false}
    target-url: ${KEEP_ALIVE_TARGET_URL:}
    interval-ms: ${KEEP_ALIVE_INTERVAL_MS:600000}

logging:
  level:
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
    com.sidequest: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
