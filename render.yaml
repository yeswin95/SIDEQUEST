# Render Blueprint for SIDEQUEST
# Supabase Postgres (external) + Backend (Spring Boot Docker) + Frontend (Next.js Web Service)
# Repo: https://github.com/yeswin95/SIDEQUEST
# Docs: https://docs.render.com/blueprint-spec

services:
  # ──────────────────────────────────────────────────────────
  # Backend: Spring Boot (Docker)
  # ──────────────────────────────────────────────────────────
  - type: web
    name: sidequest-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 10000
      - key: KEEP_ALIVE_ENABLED
        value: false
      - key: KEEP_ALIVE_TARGET_URL
        sync: false # set to https://sidequest-backend.onrender.com to enable self-ping fallback
      # Supabase connection — set via Render Dashboard or provide SPRING_DATASOURCE_URL directly
      # Supabase gives you: postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres
      # Convert to JDBC: jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require
      # You can paste either form into DATABASE_URL; DatabaseUrlProcessor converts postgres:// -> jdbc:postgresql:// automatically
      - key: DATABASE_URL
        sync: false # <-- paste Supabase Transaction Pooler (port 6543) or Session Pooler URL here in Dashboard
      # Alternative explicit JDBC URL (if you prefer to set it directly, leave DATABASE_URL empty)
      - key: SPRING_DATASOURCE_URL
        sync: false # e.g., jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false # usually: postgres.<project_ref>
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false # your Supabase DB password
      - key: JWT_SECRET
        generateValue: true # 256-bit base64, replace with your own 32+ char secret if you have one
      - key: CORS_ALLOWED_ORIGINS
        # Will be overwritten to frontend URL after first deploy; keep wildcard for initial bootstrapping
        value: https://sidequest-frontend.onrender.com,http://localhost:3000

  # ──────────────────────────────────────────────────────────
  # Frontend: Next.js (Node)
  # ──────────────────────────────────────────────────────────
  - type: web
    name: sidequest-frontend
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BACKEND_API_URL
        # Frontend rewrites /api/v1/* -> BACKEND_API_URL/api/v1/*
        # Hardcoded public URL to avoid Render fromService.host returning internal name without domain (ENOTFOUND sidequest-backend-gzia)
        # If your backend URL is different (e.g. sidequest-backend-xxxx.onrender.com), update it in Render Dashboard -> sidequest-frontend -> Environment
        value: https://sidequest-backend.onrender.com
        # Note: previously used fromService.host which returned bare internal host (sidequest-backend-gzia) without .onrender.com causing ENOTFOUND
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          name: sidequest-frontend
          type: web
          property: host

# No `databases:` section — using external Supabase Postgres.
# If you prefer Render Postgres instead, add:
# databases:
#   - name: sidequest-db
#     plan: free
#     databaseName: sidequest
#     user: sidequest
# Then change backend DATABASE_URL to fromDatabase: { name: sidequest-db, property: connectionString }
